[project]
name = "django-stubs"
version = "6.1.2"
description = "Mypy stubs for Django"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
authors = [
  { name = "Maksim Kurnikov", email = "maxim.kurnikov@gmail.com" },
]
maintainers = [
  { name = "Marti Raudsepp", email = "marti@juffo.org" },
  { name = "Nikita Sobolev", email = "mail@sobolevn.me" },
  { name = "Petter Friberg", email = "petter_friberg@hotmail.com" },
  { name = "Adam Johnson", email = "me@adamj.eu" },
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
]
dependencies = [
  "django",
  "django-stubs-ext>=6.0.2",
  # Types:
  "types-pyyaml",
  "typing-extensions>=4.11.0",
]

[project.optional-dependencies]
compatible-mypy = ["mypy>=1.16,<2.5"]
oracle = ["oracledb"]
redis = ["redis", "types-redis"]

[dependency-groups]
tests = [
  # Dev tools:
  "pytest==9.2.0",
  "pytest-mypy-plugins==4.1.0",
  "pytest-shard==0.1.2",
  "pytest-xdist==3.8.0",
  # Django deps:
  "django==5.2.19; python_version < '3.12'",
  "django==6.1.3; python_version >= '3.12'",
  "mysqlclient==2.3.0",
  "psycopg[binary]==3.3.8",
  "psycopg2-binary==2.9.13",
  "jinja2==3.1.6",
  "pyyaml==6.0.3",
  # typing:
  "django-stubs[compatible-mypy,oracle,redis]",
  "types-psycopg2==2.9.21.20261030",
]
pyright = [
  "pyright==1.1.414",
]
pyrefly = [
  "pyrefly==1.4.1",
  "psycopg2-binary",
  "types-psycopg2",
]
ty = [
  "ty==0.0.99",
  "psycopg2-binary",
  "types-psycopg2",
]

dev = [
  {include-group = "tests"},
  {include-group = "pyright"},
  {include-group = "pyrefly"},
  {include-group = "ty"},
]

[project.urls]
Homepage = "https://github.com/typeddjango/django-stubs"
Funding = "https://github.com/sponsors/typeddjango"
"Release notes" = "https://github.com/typeddjango/django-stubs/releases"

[tool.uv.sources]
django-stubs = { workspace = true }
django-stubs-ext = { workspace = true }

[tool.uv.workspace]
members = ["ext"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["django-stubs", "mypy_django_plugin"]
module-root = ""

[tool.pyright]
include = ["tests/assert_type/"]
typeCheckingMode = "strict"
# Extra strict settings
reportImplicitStringConcatenation = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Don't use '# type: ignore' to suppress with pyright
enableTypeIgnoreComments = false
# If a test case uses this anti-pattern, there's likely a reason and annoying to `type: ignore`.
# Let Ruff flag it (B006)
reportCallInDefaultInitializer = "none"
# Too strict and not needed for type testing
reportMissingSuperCall = "none"
# Stubs are allowed to use private variables. We may want to test those.
reportPrivateUsage = "none"
# Stubs don't need the actual modules to be installed
reportMissingModuleSource = "none"

[tool.pyrefly]
# Respect only `# pyrefly: ignore` (ignore `# type: ignore`)
enabled-ignores = ["pyrefly"]
[tool.pyrefly.errors]
unused-ignore = true
deprecated = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
# Respect only `# ty: ignore` (ignore `# type: ignore`)
respect-type-ignore-comments = false

[tool.codespell]
ignore-words-list = "aadd,acount,asend,indentity,nam"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
# On top of Ruff's default rule set: https://docs.astral.sh/ruff/rules/
extend-select = [
  "B",        # flake8-bugbear
  "E",        # pycodestyle
  "F",        # pyflakes
  "FURB",     # refurb
  "I",        # isort
  "INP",      # flake8-no-pep420
  "PYI",      # flake8-pyi
  "RUF",      # Ruff specific rules
  "TC",       # flake8-type-checking
  "UP",       # pyupgrade
  "W",        # pycodestyle
  "banned-api",
  "blanket-noqa",
  "blanket-type-ignore",
  "multi-line-implicit-string-concatenation",
  "single-line-implicit-string-concatenation",
  "superfluous-else-break",
  "superfluous-else-continue",
  "superfluous-else-raise",
  "superfluous-else-return",
  "unnecessary-assign",
]
ignore = [
  "docstring-in-stub", # We have a few meaningful docstrings for stubs only constructs/utilities.
  "redundant-numeric-union", # This might not be obvious that `float | int` is mostly equivalent to `float` typing wise | int | str
  "t-suffixed-type-alias",
  # Preview rules with false positives
  "del-attr-with-constant", # Autofix breaks type checking when the attribute isn't declared
  "meta-class-abc-meta", # Stubs must keep the runtime metaclass
  "unused-async", # Flags async generators, by design: https://github.com/astral-sh/ruff/issues/24481
]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
  "B",
  "line-too-long",
  "ambiguous-variable-name",
  "ambiguous-function-name",
  "undefined-local-with-import-star",
  "undefined-local-with-import-star-usage",
  "undefined-export",
  "undefined-name",
  "bad-staticmethod-argument", # Parameter names must match the runtime (stubtest)
]
"tests/*.py" = ["implicit-namespace-package", "blanket-type-ignore", "mutable-class-default"]
"ext/tests/*.py" = ["implicit-namespace-package"]
"setup.py" = ["implicit-namespace-package"]
# Type fixtures: models don't need `__str__`, builtin subclasses are under test
"tests/assert_type/*.py" = [
  "B",
  "convert-typed-dict-functional-to-class",
  "django-model-without-dunder-str",
  "subclass-builtin",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"_typeshed.Self".msg = "Use typing_extensions.Self (PEP 673) instead. If you type a metaclass, add a `ruff: ignore[banned-api]`"
"typing.NoReturn".msg = "Use `typing.Never` instead."
"typing_extensions.NoReturn".msg = "Use `typing.Never` instead."
"typing.TypeVar".msg ="Only support the `default` parameter in Python 3.13 and above. Use `typing_extensions.TypeVar` instead."

[tool.ruff.lint.isort]
known-first-party = ["django_stubs_ext", "mypy_django_plugin"]
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false
