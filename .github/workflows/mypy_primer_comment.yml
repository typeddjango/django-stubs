name: Comment with mypy_primer diff

on: # zizmor: ignore[dangerous-triggers] # Needed to comment on fork PRs, the artifact is checked in `Extract diffs` and `Get PR number`
  workflow_run:
    workflows:
      - Run mypy_primer
    types:
      - completed

permissions: {}

jobs:
  comment:
    name: Comment PR from mypy_primer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download diffs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{ github.event.workflow_run.id }},
            });
            const [matchArtifact] = artifacts.data.artifacts.filter((artifact) =>
              artifact.name == "mypy_primer_diffs");

            const download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: "zip",
            });
            fs.writeFileSync("diff.zip", Buffer.from(download.data));

      # The artifact comes from the PR's own run, streaming it writes none of its entries,
      # so a symlink entry can't leak a runner file into the comment.
      - name: Extract diffs
        run: |
          unzip -p diff.zip 'diff_*.txt' | tee fulldiff.txt
          unzip -p diff.zip pr_number.txt > pr_number

      - name: Get PR number
        id: get-pr-number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(fs.readFileSync("pr_number", { encoding: "utf8" }))
            // The PR's own run wrote this number, so check it points at the PR this run tested
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber })
            if (pr.head.sha !== context.payload.workflow_run.head_sha) {
              throw new Error(`PR #${prNumber} is not the PR tested by this run`)
            }
            return prNumber

      - name: Hide old comments
        uses: int128/hide-comment-action@06152282c98d81595109f39d4d1542d0c676ffba  # v1.77.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.get-pr-number.outputs.result }}

      - name: Post comment
        id: post-comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_NUMBER: ${{ steps.get-pr-number.outputs.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MAX_CHARACTERS = 50000
            const MAX_CHARACTERS_PER_PROJECT = MAX_CHARACTERS / 3

            const fs = require('fs')
            let data = fs.readFileSync('fulldiff.txt', { encoding: 'utf8' })

            function truncateIfNeeded(original, maxLength) {
              if (original.length <= maxLength) {
                return original
              }
              let truncated = original.substring(0, maxLength)
              // further, remove last line that might be truncated
              truncated = truncated.substring(0, truncated.lastIndexOf('\n'))
              let lines_truncated = original.split('\n').length - truncated.split('\n').length
              return `${truncated}\n\n... (truncated ${lines_truncated} lines) ...`
            }

            const projects = data.split('\n\n')
            // don't let one project dominate
            data = projects.map(project => truncateIfNeeded(project, MAX_CHARACTERS_PER_PROJECT)).join('\n\n')
            // posting comment fails if too long, so truncate
            data = truncateIfNeeded(data, MAX_CHARACTERS)

            console.log("Diff from mypy_primer:")
            console.log(data)

            let body
            if (data.trim()) {
              body = 'Diff from [mypy_primer](https://github.com/hauntsaninja/mypy_primer), '
              body += 'showing the effect of this PR on type check results on a corpus of open source code:\n```diff\n'
              body += data + '```'
              await github.rest.issues.createComment({
                issue_number: Number(process.env.PR_NUMBER),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              })
            }
