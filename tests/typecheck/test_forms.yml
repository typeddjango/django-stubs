-   case: form_fields_model_form_resolves_implicit_fields
    main: |
        from django import forms
        from myapp.models import User
        from typing_extensions import reveal_type

        class PartialForm(forms.ModelForm):
            # 'name' and 'age' are inferred from Django's 'fields_for_model()'.
            class Meta:
                model = User
                fields = ["name", "age"]

        partial_form = PartialForm()
        reveal_type(partial_form.fields)  # N: Revealed type is "main.PartialForm_FieldsDict"

        reveal_type(partial_form.fields["name"])  # N: Revealed type is "django.forms.fields.CharField"
        reveal_type(partial_form.fields["age"])  # N: Revealed type is "django.forms.fields.IntegerField"

        # 'published' isn't statically defined in 'Meta.fields', so it falls back to 'Field'.
        reveal_type(partial_form.fields["published"])  # N: Revealed type is "django.forms.fields.Field"

        class AllFieldsForm(forms.ModelForm):
            class Meta:
                model = User
                fields = "__all__"

        all_form = AllFieldsForm()
        reveal_type(all_form.fields["name"])  # N: Revealed type is "django.forms.fields.CharField"
        reveal_type(all_form.fields["age"])  # N: Revealed type is "django.forms.fields.IntegerField"
        reveal_type(all_form.fields["published"])  # N: Revealed type is "django.forms.fields.BooleanField"

        class ExcludeForm(forms.ModelForm):
            class Meta:
                model = User
                exclude = ["published"]

        exclude_form = ExcludeForm()
        reveal_type(exclude_form.fields["name"])  # N: Revealed type is "django.forms.fields.CharField"
        reveal_type(exclude_form.fields["age"])  # N: Revealed type is "django.forms.fields.IntegerField"

        # Excluded field falls back to the generic 'Field' type.
        reveal_type(exclude_form.fields["published"])  # N: Revealed type is "django.forms.fields.Field"

