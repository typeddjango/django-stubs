-   case: form_fields_attribute_is_typed_per_declared_field
    main: |
        from typing import Any
        from django import forms
        from typing_extensions import reveal_type

        class MyForm(forms.Form):
            age = forms.IntegerField()

            def __init__(self, *args: Any, **kwargs: Any) -> None:
                super().__init__(*args, **kwargs)
                # Dynamically add a field at runtime.
                self.fields["dynamic"] = forms.CharField()

        form = MyForm()
        reveal_type(form.fields)  # N: Revealed type is "main.MyForm_FieldsDict"

        # Static field should be typed according to its declared type.
        reveal_type(form.fields["age"])  # N: Revealed type is "django.forms.fields.IntegerField"

        # Dynamic key should fall back to the generic 'Field'.
        reveal_type(form.fields["dynamic"])  # N: Revealed type is "django.forms.fields.Field"

        # Undefined key should fall back to the generic 'Field'.
        reveal_type(form.fields["undefined"])  # N: Revealed type is "django.forms.fields.Field"

        # An undeclared Form falls back to the default 'dict[str, Field]' typing since it has no
        # statically-known fields.
        plain_form = forms.Form()
        reveal_type(plain_form.fields)  # N: Revealed type is "dict[str, django.forms.fields.Field]"

-   case: form_fields_dict_subclass_supports_common_mutations
    main: |
        from django import forms
        from typing_extensions import reveal_type

        class MyForm(forms.Form):
            age = forms.IntegerField()
            name = forms.EmailField()

        form = MyForm()

        # Iterating should narrow the values type to 'Field'.
        for field in form.fields.values():
            reveal_type(field)  # N: Revealed type is "django.forms.fields.Field"

        # Deletion and pop should be allowed.
        del form.fields["age"]
        form.fields.pop("name", None)

        # Assigning through a non-literal key should be allowed too.
        key: str = "age"
        form.fields[key] = forms.IntegerField()

        # Reassignment should be allowed.
        form.fields = {}

