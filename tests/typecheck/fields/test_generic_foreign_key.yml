-   case: generic_relation_is_not_typed_as_its_related_model
    main: |
        from typing_extensions import reveal_type
        from myapp.models import Contract
        reveal_type(Contract().orders)  # N: Revealed type is "Any"
        reveal_type(Contract().orders_by_name)  # N: Revealed type is "Any"
    installed_apps:
        - myapp
        - django.contrib.contenttypes
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models
                from django.contrib.contenttypes import fields
                class Order(models.Model):
                    content_object = fields.GenericForeignKey()
                class Contract(models.Model):
                    orders = fields.GenericRelation(Order)
                    orders_by_name = fields.GenericRelation("myapp.Order")
