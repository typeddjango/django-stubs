# Regression test for #893
-   case: annotated_should_not_interfere
    main: |
        from dataclasses import dataclass
        from typing_extensions import Annotated, TypedDict, reveal_type
        from myapp.models import Blog

        class IntegerType:
            def __init__(self, min_value: int, max_value: int) -> None:
                pass

        @dataclass(unsafe_hash=True)
        class RatingComposite:
            max_value: Annotated[int, IntegerType(min_value=1, max_value=10)] = 5

        class Obj(TypedDict):
            foo: int

        class X:
            x: Annotated[Blog, Obj]
        reveal_type(X().x)  # N: Revealed type is "myapp.models.Blog"
        reveal_type(X().x.foo)  # E: "Blog" has no attribute "foo"  [attr-defined]  # N: Revealed type is "Any"

    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models
                class Blog(models.Model):
                    text = models.CharField(max_length=100)

# Regression test for #3658. A TypedDict item wrapped in `Annotated` makes mypy's
# analyser hand the plugin a transient `RequiredType` / `ReadOnlyType`, which is not a
# `ProperType`; the plugin used to pass it to `get_proper_type` and crash with an
# INTERNAL ERROR. The plugin now leaves those wrappers alone, so an ordinary
# `Annotated` field elsewhere (the case above) must still be handled by the plugin.
-   case: annotated_typeddict_items_do_not_crash
    main: |
        from typing import Annotated, NotRequired, Required, TypedDict

        from typing_extensions import ReadOnly

        def keep_last(left: list[str], right: list[str]) -> list[str]:
            return right

        class NotRequiredState(TypedDict):
            items: Annotated[NotRequired[list[str]], keep_last]

        class RequiredState(TypedDict, total=False):
            items: Annotated[Required[list[str]], keep_last]

        class ReadOnlyState(TypedDict):
            items: Annotated[ReadOnly[list[str]], keep_last]

        def read(a: NotRequiredState, b: RequiredState, c: ReadOnlyState) -> None: ...
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models
                class Blog(models.Model):
                    text = models.CharField(max_length=100)
